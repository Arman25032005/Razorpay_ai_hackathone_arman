<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RecoverAI: AI Revenue Recovery Agent</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app" class="gate-hidden">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">R</div>
      <div>
        <div class="brand-name">RecoverAI</div>
        <div class="brand-sub">Revenue Recovery Agent</div>
      </div>
    </div>
    <nav class="nav" id="mainNav">
      <button class="nav-item active" data-view="dashboard" data-icon="dashboard">
        <span class="nav-ico"></span> Executive Dashboard
      </button>
      <button class="nav-item" data-view="cases" data-icon="cases">
        <span class="nav-ico"></span> Recovery Cases
      </button>
      <button class="nav-item" data-view="activity" data-icon="activity">
        <span class="nav-ico"></span> Agent Activity
      </button>
      <button class="nav-item" data-view="escalations" data-icon="escalations">
        <span class="nav-ico"></span> Human Review Queue
      </button>
      <button class="nav-item" data-view="analytics" data-icon="analytics">
        <span class="nav-ico"></span> Analytics
      </button>
      <button class="nav-item" data-view="policies" data-icon="policies">
        <span class="nav-ico"></span> Policies
      </button>
      <button class="nav-item" data-view="integrations" data-icon="integrations">
        <span class="nav-ico"></span> Integrations
      </button>
    </nav>
    <div class="sidebar-foot">
      <button id="runSimBtn" class="btn-primary full"><span class="btn-ico"></span><span class="btn-label">Run Recovery Simulation</span></button>
      <button id="replayBtn" class="btn-ghost full"><span class="btn-ico"></span><span class="btn-label">Replay Best Recovery</span></button>
      <button id="resetSimBtn" class="btn-ghost full"><span class="btn-ico"></span><span class="btn-label">Reset demo data</span></button>
      <button id="themeToggleBtn" class="btn-ghost full"><span class="btn-ico"></span><span class="btn-label">Dark mode</span></button>
      <button id="logoutBtn" class="btn-ghost full gate-hidden"><span class="btn-ico"></span><span class="btn-label">Sign out</span></button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div id="topbarTitle">Executive Dashboard</div>
      <div class="topbar-right">
        <select id="merchantSwitcher" class="merchant-switcher"></select>
        <span class="badge-mode">DEMO MODE</span>
      </div>
    </header>
    <div id="viewRoot" class="view-root">
      <!-- views injected here -->
    </div>
  </main>
</div>

<div id="loginScreen" class="login-screen gate-hidden">
  <div class="login-card">
    <div class="brand-mark">R</div>
    <h1>RecoverAI</h1>
    <div class="sub">Sign in to continue</div>
    <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">
    <button id="loginSubmitBtn" class="btn-primary">Sign in</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/static/app.js"></script>
</body>
</html>
