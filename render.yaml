services:
  - type: web
    name: recoverai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: recoverai-db
          property: connectionString
      - key: LLM_API_KEY
        sync: false
      - key: API_KEY
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false

databases:
  - name: recoverai-db
    plan: free
    databaseName: recoverai
    user: recoverai
